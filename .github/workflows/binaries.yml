name: Binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sea:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: kestrel-linux-x64
          - os: macos-latest
            name: kestrel-macos
          - os: windows-latest
            name: kestrel-windows-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Build npm package
        run: npm run build
      - name: Build single executable
        run: node scripts/sea/build.mjs
      - name: Smoke test tree-sitter
        run: node scripts/sea/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.os == 'windows-latest' && 'dist/sea/kestrel.exe' || 'dist/sea/kestrel' }}
          if-no-files-found: error
