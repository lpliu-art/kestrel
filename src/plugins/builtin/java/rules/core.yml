pack: java-core
version: 1.0.0
rules:
  - id: java.security.sql-concat
    title: { en: "SQL built by concatenation", zh-CN: "通过拼接构造 SQL" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'execute(?:Query|Update)?\s*\(\s*[^)\n]*\+'
    question:
      question: "Do the added lines in `hunk` pass SQL built by concatenation to Statement.execute?"
      focus: "Lines marked with + that call execute, executeQuery, or executeUpdate with a plus sign"
      true: { what: "SQL text passed to execute contains a concatenated value" }
      false: { what: "A prepared statement binds the value" }
    severity:
      levels: ["Constant SQL", "Internal input", "Request input"]
      map: [medium, high, critical]
      default: high
      min: medium
    message:
      en:
        body: "Line {{line}} builds SQL by concatenation; this may allow SQL injection."
        why: "The database parses the concatenated value as SQL."
      zh-CN:
        body: "第 {{line}} 行通过拼接构造 SQL，可能导致 SQL 注入。"
        why: "数据库会把拼接进去的值当作 SQL 解析。"
    fix:
      hint:
        en: "Use a PreparedStatement and bind the value with setString."
        zh-CN: "改用 PreparedStatement，并用 setString 绑定参数。"
    references: ["CWE-89"]
    examples:
      positive:
        - code: |
            stmt.executeQuery("SELECT * FROM users WHERE id=" + id);
      negative:
        - code: |
            ps.setString(1, id);

  - id: java.security.deserialization
    title: { en: "Java deserialization of external data", zh-CN: "反序列化外部数据" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: '\bnew\s+ObjectInputStream\s*\(|\.readObject\s*\('
    question:
      question: "Do the added lines in `hunk` deserialize objects with ObjectInputStream or readObject?"
      focus: "Lines marked with + that construct ObjectInputStream or call readObject"
      true: { what: "readObject is used on a stream that may contain external data" }
      false: { what: "No Java object deserialization is added" }
    severity:
      levels: ["A trusted local file", "Data from the network"]
      map: [high, critical]
      default: critical
      min: high
    message:
      en:
        body: "Line {{line}} deserializes a Java object from a stream."
        why: "readObject can execute code controlled by the bytes on the stream."
      zh-CN:
        body: "第 {{line}} 行从流中反序列化 Java 对象。"
        why: "readObject 可能执行流中字节所控制的代码。"
    fix:
      hint:
        en: "Reject Java serialization at the boundary and use an explicit schema such as JSON."
        zh-CN: "在边界上拒绝 Java 序列化，改用 JSON 这类显式格式。"
    references: ["CWE-502"]
    examples:
      positive:
        - code: |
            ObjectInputStream in = new ObjectInputStream(socket.getInputStream());
            Object value = in.readObject();
      negative:
        - code: |
            String line = reader.readLine();

  - id: java.exception.swallowed
    title: { en: "Swallowed exception", zh-CN: "吞掉的异常" }
    category: reliability
    dimension: reliability
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'catch\s*\([^)]+\)\s*\{\s*(?:\}|[^}]*printStackTrace\s*\(\s*\)\s*;\s*\})'
    question:
      question: "Do the added lines in `hunk` catch an exception and either ignore it or only print the stack trace?"
      focus: "Lines marked with + that contain an empty catch or printStackTrace"
      true: { what: "The catch block is empty or only calls printStackTrace" }
      false: { what: "The catch rethrows or returns a handled result" }
    severity:
      levels: ["A cleanup path", "An operation whose failure is hidden"]
      map: [low, medium]
      default: medium
    message:
      en:
        body: "Line {{line}} catches an exception without handling it."
        why: "Empty catches and printStackTrace hide failures from callers."
      zh-CN:
        body: "第 {{line}} 行捕获异常后没有真正处理。"
        why: "空 catch 和只调用 printStackTrace 会让调用方看不到失败。"
    fix:
      hint:
        en: "Rethrow a wrapped exception or handle it and return a result."
        zh-CN: "包装后重新抛出，或者处理完并返回结果。"
    examples:
      positive:
        - code: |
            try { run(); } catch (Exception e) { }
      negative:
        - code: |
            try { run(); } catch (Exception e) { throw e; }

  - id: java.resource.no-try-with-resources
    title: { en: "Resource opened outside try-with-resources", zh-CN: "资源没有使用 try-with-resources" }
    category: reliability
    dimension: reliability
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'new\s+(?:FileInputStream|FileOutputStream|BufferedReader)\s*\('
    question:
      question: "Do the added lines in `hunk` open a stream without try-with-resources?"
      focus: "Lines marked with + that construct FileInputStream, FileOutputStream, or BufferedReader"
      true: { what: "A closable resource is constructed outside try-with-resources" }
      false: { what: "The resource is opened in a try-with-resources statement" }
    severity:
      levels: ["A short-lived tool", "A server path that can leak descriptors"]
      map: [low, medium]
      default: medium
    mock:
      negative: 'try\s*\('
    message:
      en:
        body: "Line {{line}} opens a stream outside try-with-resources."
        why: "If an exception is thrown before close, the descriptor leaks."
      zh-CN:
        body: "第 {{line}} 行打开流时没有使用 try-with-resources。"
        why: "如果在 close 之前抛出异常，文件描述符会泄漏。"
    fix:
      hint:
        en: "Open the stream in try-with-resources so it always closes."
        zh-CN: "把流放进 try-with-resources，确保一定会关闭。"
    examples:
      positive:
        - code: |
            FileInputStream in = new FileInputStream(path);
      negative:
        - code: |
            try (FileInputStream in = new FileInputStream(path)) {
                in.read();
            }

  - id: java.concurrency.unsafe-shared-state
    title: { en: "Unsafe shared mutable static", zh-CN: "不安全的共享可变静态状态" }
    category: reliability
    dimension: reliability
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'static\s+(?:final\s+)?(?:SimpleDateFormat|HashMap|Hashtable)\b'
    question:
      question: "Do the added lines in `hunk` store a SimpleDateFormat or HashMap in a static field that threads can share?"
      focus: "Lines marked with + that declare a static SimpleDateFormat or HashMap"
      true: { what: "A static field holds a non-thread-safe mutable object" }
      false: { what: "The type is thread-safe, such as DateTimeFormatter or ConcurrentHashMap" }
    severity:
      levels: ["A field that is never shared", "A field used by request threads"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} shares a mutable SimpleDateFormat or HashMap through a static field."
        why: "Those types are not thread-safe, so concurrent requests can corrupt them."
      zh-CN:
        body: "第 {{line}} 行用静态字段共享可变的 SimpleDateFormat 或 HashMap。"
        why: "这些类型不是线程安全的，并发请求可能把状态写坏。"
    fix:
      hint:
        en: "Use DateTimeFormatter or ConcurrentHashMap, or keep the object on the stack."
        zh-CN: "改用 DateTimeFormatter 或 ConcurrentHashMap，或者把对象留在栈上。"
    examples:
      positive:
        - code: |
            static SimpleDateFormat FMT = new SimpleDateFormat("yyyy");
      negative:
        - code: |
            static final DateTimeFormatter FMT = DateTimeFormatter.ISO_INSTANT;

  - id: java.spring.transactional-self-invocation
    title: { en: "Transactional self-invocation", zh-CN: "同类内部调用事务方法" }
    category: correctness
    dimension: correctness
    applies:
      languages: [java]
      frameworks: [spring]
    trigger:
      kind: regex
      on: added
      pattern: '@Transactional[\s\S]{0,400}this\.\w+\s*\('
    question:
      question: "Do the added lines in `hunk` call a method on this from a class that uses @Transactional?"
      focus: "Lines marked with + that combine @Transactional and this.method()"
      true: { what: "A @Transactional method is invoked through this" }
      false: { what: "The call goes through an injected Spring bean" }
    severity:
      levels: ["A call that does not need a new transaction", "A call that expected a transaction proxy"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} calls a transactional method through this, which skips the Spring proxy."
        why: "Self-invocation does not start the transaction the annotation describes."
      zh-CN:
        body: "第 {{line}} 行通过 this 调用事务方法，Spring 代理不会生效。"
        why: "同类自调用不会按注解开启事务。"
    fix:
      hint:
        en: "Move the method to another bean and inject it, or call it through AopContext if that is already the project pattern."
        zh-CN: "把方法挪到另一个 bean 再注入调用；只有项目已经采用 AopContext 时才走那条路。"
    examples:
      positive:
        - code: |
            @Transactional
            public void outer() { this.inner(); }
      negative:
        - code: |
            public void outer() { service.inner(); }

  - id: java.npe.nullable-deref
    title: { en: "Nullable value dereferenced", zh-CN: "解引用了可能为空的值" }
    category: correctness
    dimension: correctness
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: '\.get\(\)\.'
    question:
      question: "Do the added lines in `hunk` dereference Optional.get without a presence check?"
      focus: "Lines marked with + that call get() and immediately use the result"
      true: { what: "Optional.get is dereferenced" }
      false: { what: "The value is mapped or checked with isPresent" }
    severity:
      levels: ["A value known to be present", "A value that may be empty"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} calls Optional.get and uses the result."
        why: "get throws when the Optional is empty."
      zh-CN:
        body: "第 {{line}} 行调用了 Optional.get 并直接使用结果。"
        why: "Optional 为空时 get 会抛异常。"
    fix:
      hint:
        en: "Use map, orElse, or isPresent before reading the value."
        zh-CN: "用 map、orElse，或者先 isPresent 再读取。"
    examples:
      positive:
        - code: |
            String name = user.get().name;
      negative:
        - code: |
            String name = user.map(User::name).orElse("");

  - id: java.security.mybatis-interpolation
    title: { en: "MyBatis ${} interpolation", zh-CN: "MyBatis 使用了 ${} 插值" }
    category: security
    dimension: security
    applies:
      languages: [xml]
      paths: ["**/*Mapper.xml"]
    trigger:
      kind: regex
      on: added
      pattern: '\$\{'
    question:
      question: "Do the added lines in `hunk` interpolate a MyBatis value with ${}?"
      focus: "Lines marked with + that contain ${}"
      true: { what: "A ${} placeholder is added in a mapper" }
      false: { what: "The value uses #{}" }
    severity:
      levels: ["A trusted column name", "A value that can come from a request"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} interpolates SQL with ${}."
        why: "${} splices the value into SQL text."
      zh-CN:
        body: "第 {{line}} 行用 ${} 把值拼进了 SQL。"
        why: "${} 会把值直接拼进 SQL 文本。"
    fix:
      hint:
        en: "Use #{} so MyBatis binds the value."
        zh-CN: "改用 #{}，让 MyBatis 绑定参数。"
    references: ["CWE-89"]
    examples:
      positive:
        - language: xml
          path: src/UserMapper.xml
          code: |
            <mapper>
            SELECT * FROM users WHERE id = ${id}
            </mapper>
      negative:
        - language: xml
          path: src/UserMapper.xml
          code: |
            <mapper>
            SELECT * FROM users WHERE id = #{id}
            </mapper>

  - id: java.security.xxe
    title: { en: "XML parser with default external entities", zh-CN: "XML 解析器允许外部实体" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'DocumentBuilderFactory\.newInstance\('
    question:
      question: "Do the added lines in `hunk` create a DocumentBuilderFactory?"
      focus: "Lines marked with + that call DocumentBuilderFactory.newInstance"
      true: { what: "A DocumentBuilderFactory is created" }
      false: { what: "The code does not create an XML factory" }
    severity:
      levels: ["A parser that later disables external entities", "A parser used on request XML"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} creates a DocumentBuilderFactory."
        why: "The default factory resolves external entities."
      zh-CN:
        body: "第 {{line}} 行创建了 DocumentBuilderFactory。"
        why: "默认工厂会解析外部实体。"
    fix:
      hint:
        en: "Disable external entities and DTDs before parsing."
        zh-CN: "解析前关闭外部实体和 DTD。"
    references: ["CWE-611"]
    examples:
      positive:
        - code: |
            DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();
      negative:
        - code: |
            parser.parse(safe);

  - id: java.security.weak-random
    title: { en: "java.util.Random for a secret", zh-CN: "用 java.util.Random 生成秘密" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'new Random\('
    question:
      question: "Do the added lines in `hunk` construct a java.util.Random?"
      focus: "Lines marked with + that call new Random"
      true: { what: "java.util.Random is constructed" }
      false: { what: "SecureRandom is used" }
    severity:
      levels: ["A non-secret shuffle", "A token or password"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} uses java.util.Random."
        why: "java.util.Random is predictable."
      zh-CN:
        body: "第 {{line}} 行使用了 java.util.Random。"
        why: "java.util.Random 是可预测的。"
    fix:
      hint:
        en: "Use java.security.SecureRandom for secrets."
        zh-CN: "生成秘密时改用 java.security.SecureRandom。"
    references: ["CWE-338"]
    examples:
      positive:
        - code: |
            Random random = new Random();
      negative:
        - code: |
            SecureRandom random = new SecureRandom();

  - id: java.security.runtime-exec
    title: { en: "Runtime.exec of a command", zh-CN: "Runtime.exec 执行命令" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'Runtime\.getRuntime\(\)\.exec\('
    question:
      question: "Do the added lines in `hunk` call Runtime.exec?"
      focus: "Lines marked with + that call Runtime.getRuntime().exec"
      true: { what: "Runtime.exec is called" }
      false: { what: "The code does not start a process this way" }
    severity:
      levels: ["A constant command", "A command that includes request data"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} calls Runtime.exec."
        why: "The command string can be changed by whoever controls the argument."
      zh-CN:
        body: "第 {{line}} 行调用了 Runtime.exec。"
        why: "控制参数的人可以改掉要执行的命令。"
    fix:
      hint:
        en: "Pass a fixed argument list to ProcessBuilder and avoid a shell."
        zh-CN: "用 ProcessBuilder 传入固定参数列表，不要经过 shell。"
    references: ["CWE-78"]
    examples:
      positive:
        - code: |
            Runtime.getRuntime().exec(cmd);
      negative:
        - code: |
            processBuilder.command(cmd);

  - id: java.security.path-concat
    title: { en: "File path built by concatenation", zh-CN: "通过拼接构造文件路径" }
    category: security
    dimension: security
    applies: { languages: [java] }
    trigger:
      kind: regex
      on: added
      pattern: 'new File\(\s*[^)\n]*\+'
    question:
      question: "Do the added lines in `hunk` build a File path by concatenation?"
      focus: "Lines marked with + that pass a concatenated string to new File"
      true: { what: "A File path contains a concatenated value" }
      false: { what: "The path is built with Path.of and a safe base" }
    severity:
      levels: ["A constant suffix", "A value from a request"]
      map: [medium, high]
      default: high
    message:
      en:
        body: "Line {{line}} builds a file path by concatenation."
        why: "A ../ segment in the value can escape the intended directory."
      zh-CN:
        body: "第 {{line}} 行通过拼接构造文件路径。"
        why: "值里的 ../ 可以逃出预期目录。"
    fix:
      hint:
        en: "Resolve the path against a base directory and reject values that escape it."
        zh-CN: "相对基准目录解析路径，并拒绝逃出该目录的值。"
    references: ["CWE-22"]
    examples:
      positive:
        - code: |
            File file = new File("/tmp/" + name);
      negative:
        - code: |
            Path path = Path.of(base, name);
