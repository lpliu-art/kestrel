version: 1
profile: balanced
output:
  language: zh-CN
  formats: [terminal]
jev:
  provider: mock
  model: jev-1.13.0
gate:
  failOn: high
  minProbability: 0.8

checks:
  - id: team.api.validate-body
    paths: ["src/api/**"]
    ask: "Request handlers must validate the body before use"
    expect: true
    severity: high
    examples:
      positive:
        - code: |
            db.insert(req.body)
      negative:
        - code: |
            const body = schema.parse(req.body)

static:
  sarif: []
  filterMode: added

llm:
  enabled: false
  protocol: openai
  baseURL: https://api.openai.com/v1
  apiKeyEnv: KESTREL_LLM_API_KEY
  maxFindings: 10
  verifyWithJev: true
