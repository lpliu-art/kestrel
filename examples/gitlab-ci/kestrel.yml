# GitLab CI template for Kestrel Review.
# Live merge-request notes need GITLAB_TOKEN (or CI_JOB_TOKEN) with API access.
# This example uses the mock provider so a pipeline can run without a Jev key.
kestrel:
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - npx -y kestrel-review@0.3.0 review --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --provider mock --format json --out kestrel.json --incremental
    - npx -y kestrel-review@0.3.0 gitlab post --report kestrel.json --project "$CI_PROJECT_PATH" --mr "$CI_MERGE_REQUEST_IID"
